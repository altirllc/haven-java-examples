name: Build loom jobs

# haven-java-examples holds more than one app, and loom holds more than one
# deployable. Each workflow is scoped to the modules its image actually
# contains, so editing the frontend does not rebuild and republish the backend.
on:
  push:
    branches: [main, develop]
    paths:
      - 'loom/backend/domain/**'
      - 'loom/backend/contracts/**'
      - 'loom/backend/orchestration/**'
      - 'loom/backend/persistence/**'
      - 'loom/backend/agent/**'
      - 'loom/backend/workflows/**'
      - 'loom/backend/jobs/**'
      - 'loom/backend/pom.xml'
      - 'loom/backend/.mvn/**'
      - 'loom/backend/mvnw'
      - '.github/workflows/loom-jobs.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'loom/backend/**'
  workflow_dispatch:
    inputs:
      tag_as_latest:
        description: 'Tag this build as latest'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/loom-jobs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The Dispatch client is published to Altir's Artifactory, so the reactor
      # needs credentials even for modules that do not use it — the parent pom
      # declares the repository for everything under it.
      - name: Configure Maven credentials
        env:
          # Through env, not inline: the value is XML with quotes in it, and an
          # inline expansion would be pasted into the shell source.
          MAVEN_SETTINGS: ${{ secrets.MAVEN_SETTINGS }}
        run: |
          # Refuse by name when the secret is absent. Writing the empty string
          # produces a settings.xml Maven cannot parse, and the resulting
          # "Non-readable settings: input contained no data" sends whoever reads
          # it to debug Maven configuration instead of adding a secret.
          if [ -z "$MAVEN_SETTINGS" ]; then
            echo "::error::MAVEN_SETTINGS is not set. It must carry a settings.xml with a <server> entry for id fn-libs-release-local — Altir's Artifactory serves the Dispatch client and rejects anonymous reads (401)."
            exit 1
          fi
          mkdir -p ~/.m2
          printf '%s' "$MAVEN_SETTINGS" > ~/.m2/settings.xml
          # The image build needs the same file, and it has to arrive as a FILE.
          # build-push-action parses its `secrets:` input as one KEY=VALUE per
          # LINE, so a multi-line XML value silently becomes just its first line
          # — and every remaining line is read as another secret id. Maven then
          # fails with "no more data available START_DOCUMENT seen".
          cp ~/.m2/settings.xml "$RUNNER_TEMP/maven-settings.xml"

      # The image builds Java inside Docker, but running the build here first
      # validates and caches it before we spend a push — and it is where the
      # determinism fence and the tests actually run.
      - name: Build and test
        working-directory: loom/backend
        run: ./mvnw -B -ntp -pl jobs -am verify

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' || inputs.tag_as_latest == true }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./loom/backend
          file: ./loom/backend/jobs/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The one image that resolves the Dispatch client during its own
          # build. A secret, not a build arg: an arg lands in the image history.
          # secret-files, not secrets: the value is multi-line XML — see the
          # credentials step above.
          secret-files: |
            maven_settings=${{ runner.temp }}/maven-settings.xml
