# Mirrors the app configs' data-layer settings so the test exercises the same
# path a cell runs: schema-pinned Hikari, Liquibase DDL, Hibernate validation.
spring:
  datasource:
    hikari:
      schema: loom
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

plan:
  name: ${PLAN:free}
  free-cases: ${PLAN_FREE_CASES:10}

# CaseProperties is @Validated with a @NotNull sla and is picked up by the
# configuration-properties scan, so the context refuses to start without this
# even though the test passes its own SLA per case. Mirrors the app configs.
cases:
  sla: ${CASE_SLA:24h}
