<!-- favicon-h-stack.svg -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
>

  <!-- Transparent background to avoid Safari’s forced white fill -->
  <rect width="64" height="64" fill="none"/>

  <!-- Dark rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#020617"/>

  <!-- Left vertical bar -->
  <rect x="18" y="18" width="6" height="28" rx="3" fill="#0EA5E9"/>

  <!-- Right vertical bar -->
  <rect x="40" y="18" width="6" height="28" rx="3" fill="#38BDF8"/>

  <!-- Top cross “layer” -->
  <rect x="22" y="20" width="16" height="6" rx="3" fill="#22C55E"/>

  <!-- Middle cross “layer” -->
  <rect x="22" y="29" width="16" height="6" rx="3" fill="#A855F7"/>

  <!-- Bottom cross “layer” -->
  <rect x="22" y="38" width="16" height="6" rx="3" fill="#F97316"/>

</svg>