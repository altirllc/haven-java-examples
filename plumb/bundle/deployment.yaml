apiVersion: apps/v1
kind: Deployment
metadata:
  name: plumb
  labels:
    app: plumb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plumb
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /actuator/prometheus
      labels:
        app: plumb
    spec:
      # Kubernetes injects ~8 Docker-link-era env vars per Service in the
      # namespace, and they outrank application.yaml. `valkey` is a Service
      # here, so VALKEY_PORT would arrive as "tcp://10.2.14.171:6379" and bind
      # over valkey.port. ValkeyProperties takes the port as a String so that
      # cannot kill the boot; this line is why the row stays HONEST rather than
      # reporting the cache as misconfigured. Both are needed — keep them.
      # Links also only inject for Services that existed before the pod started,
      # so without this the behaviour differs between a fresh install and a
      # restart, which is the worst kind of bug to chase.
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/altirllc/plumb:latest
          ports:
            - name: api
              containerPort: 3000
              protocol: TCP
          # This env block IS the deliverable. It is the complete wiring a Java
          # application gets in a tenant vCluster, and plumb exercises every line
          # of it — so a green page here is proof the block is correct, and this
          # file is the thing to copy when wiring a new app.
          #
          # Note every secretKeyRef is `optional: true`. Everywhere else that
          # would be wrong; here a missing secret must produce a SKIPPED row that
          # names the variable, not a pod that will not start.
          envFrom:
            - secretRef:
                name: tenant-s3-secret
                optional: true
            - secretRef:
                name: tenant-models-secret
                optional: true
            # The feature toggles from service.json land here. Without this
            # mount the console's switches render and write a ConfigMap that
            # nothing reads, so flipping one appears to do nothing.
            - configMapRef:
                name: plumb-config
                optional: true
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: HAVEN_TENANT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['haven.tenant']
            # Temporal, replicated into the vCluster. The namespace is the
            # tenant; the task queue is this app's own, so its worker cannot
            # steal another app's work.
            - name: TEMPORAL_ADDRESS
              value: "workflows-temporal.default:7233"
            - name: TEMPORAL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['haven.tenant']
            - name: TEMPORAL_TASK_QUEUE
              value: "plumb"
            # Postgres: one instance per tenant, two databases on it.
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tenant-postgres-secret
                  key: POSTGRES_USERNAME
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-postgres-secret
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POSTGRES_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: tenant-postgres-secret
                  key: POSTGRES_RECORDS_DATABASE
                  optional: true
            - name: POSTGRES_VECTORS_NAME
              valueFrom:
                secretKeyRef:
                  name: tenant-postgres-secret
                  key: POSTGRES_VECTORS_DATABASE
                  optional: true
            # $(VAR) expands from env vars declared EARLIER in this same
            # container — a Kubernetes feature, not a templating accident.
            - name: POSTGRES_DATABASE_URL
              value: "jdbc:postgresql://postgres:5432/$(POSTGRES_DATABASE_NAME)"
            - name: POSTGRES_VECTORS_URL
              value: "jdbc:postgresql://postgres:5432/$(POSTGRES_VECTORS_NAME)"
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tenant-mongodb-secret
                  key: MONGODB_USERNAME
                  optional: true
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-mongodb-secret
                  key: MONGODB_PASSWORD
                  optional: true
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@mongodb:27017/plumb?authSource=admin"
            # Neo4j, on the bolt port. Every tenant is given one in the baseline
            # stack; no catalog bundle consumed it before this probe, so this is
            # the first thing that checks a tenant's graph database works.
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tenant-neo4j-secret
                  key: NEO4J_USERNAME
                  optional: true
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-neo4j-secret
                  key: NEO4J_PASSWORD
                  optional: true
            - name: NEO4J_URI
              value: "bolt://neo4j:7687"
            # The cache carries no credential — reachable inside this vCluster
            # and nowhere else. REDIS_* is the platform's existing name for it.
            - name: REDIS_HOST
              value: "valkey"
            - name: REDIS_PORT
              value: "6379"
            # Model gateway aliases name the ROLE, not the vendor model.
            - name: MODELS_CHAT_MODEL
              value: "chat-with-haven"
            - name: MODELS_EMBEDDING_MODEL
              value: "text-embedding-1024"
            - name: ZITADEL_ISSUER
              valueFrom:
                secretKeyRef:
                  name: tenant-zitadel-secret
                  key: ZITADEL_ISSUER
                  optional: true
            - name: ZITADEL_MCP_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: tenant-zitadel-secret
                  key: ZITADEL_MCP_AUDIENCE
                  optional: true
          # A JVM needs a startupProbe: readiness timings that suit Node would
          # kill the pod mid-boot. Readiness carries NO seam checks — plumb must
          # stay in service precisely when a seam is down, or the tenant loses
          # the only thing that could explain the outage.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 3000
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 3000
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 512Mi
            limits:
              # MaxRAMPercentage=75 in the image sizes the heap off this limit,
              # so it must be set or the JVM assumes the whole node.
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir: {}
